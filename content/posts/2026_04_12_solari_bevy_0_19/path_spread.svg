<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" font-family="sans-serif">
  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#e0e0e0"/>
    </marker>
  </defs>

  <rect width="720" height="340" fill="#1a1a2e" rx="8"/>

  <!-- Camera icon -->
  <!-- Body -->
  <rect x="22" y="62" width="32" height="26" fill="#4a9eff" rx="3"/>
  <!-- Lens - trapezoid/frustum -->
  <polygon points="54,65 68,60 68,90 54,85" fill="#3a8adf"/>
  <text x="45" y="110" fill="#8ab4f8" font-size="12" text-anchor="middle">Camera</text>

  <!-- Ray from camera to surface 1 (mirror) - angled down, just a line -->
  <line x1="68" y1="75" x2="155" y2="130" stroke="#e0e0e0" stroke-width="1.5"/>

  <!-- Surface 1 - mirror (angled) -->
  <line x1="145" y1="100" x2="165" y2="165" stroke="#4a9eff" stroke-width="3"/>
  <text x="130" y="93" fill="#4a9eff" font-size="11" text-anchor="middle">Mirror</text>
  <text x="155" y="185" fill="#6a6a8e" font-size="10" text-anchor="middle">spread: 0</text>

  <!-- Ray from surface 1 to surface 2 - still just a line, mirror adds no spread -->
  <line x1="155" y1="130" x2="320" y2="88" stroke="#e0e0e0" stroke-width="1.5"/>

  <!-- Surface 2 - semi-rough (angled) -->
  <line x1="308" y1="58" x2="332" y2="120" stroke="#ff9f43" stroke-width="3"/>
  <text x="350" y="58" fill="#ff9f43" font-size="11" text-anchor="middle">Semi-rough</text>
  <text x="320" y="140" fill="#6a6a8e" font-size="10" text-anchor="middle">spread: small</text>

  <!-- Cone from surface 2 to surface 3 - medium cone, angled down-right -->
  <polygon points="320,88 500,170 500,210" fill="#e0e0e0" opacity="0.15"/>
  <polygon points="320,88 500,178 500,202" fill="#e0e0e0" opacity="0.12"/>
  <line x1="320" y1="88" x2="500" y2="190" stroke="#e0e0e0" stroke-width="1.5"/>

  <!-- Surface 3 - rough (angled) -->
  <line x1="490" y1="160" x2="510" y2="225" stroke="#ff6b6b" stroke-width="3"/>
  <text x="530" y="163" fill="#ff6b6b" font-size="11" text-anchor="middle">Rough</text>
  <text x="500" y="245" fill="#6a6a8e" font-size="10" text-anchor="middle">spread: medium</text>

  <!-- Cone from surface 3 to world cache - wide cone, LARGER than WC cell -->
  <polygon points="500,190 670,75 670,215" fill="#e0e0e0" opacity="0.15"/>
  <polygon points="500,190 670,95 670,195" fill="#e0e0e0" opacity="0.12"/>
  <polygon points="500,190 670,115 670,175" fill="#e0e0e0" opacity="0.1"/>
  <line x1="500" y1="190" x2="665" y2="145" stroke="#e0e0e0" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- World cache cell - square, smaller than cone -->
  <rect x="643" y="120" width="50" height="50" fill="none" stroke="#50c878" stroke-width="2" stroke-dasharray="6,3" rx="2"/>
  <text x="668" y="198" fill="#50c878" font-size="11" text-anchor="middle">World cache</text>
  <text x="668" y="212" fill="#50c878" font-size="11" text-anchor="middle">cell</text>

  <!-- Annotation -->
  <text x="360" y="300" fill="#aaaacc" font-size="11" text-anchor="middle">Cone base exceeds cell size → terminate into world cache</text>
</svg>
